spring:
  application:
    name: backend

    datasource:
      url: ${SPRING_DATABASE_URL}
      username: ${SPRING_DATABASE_USERNAME}
      passowrd: ${SPRING_DATABASE_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect
          format_sql: true
        show-sql: true

    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true

app:
  base-url: ${BASE_URL}
  client-url: ${CLIENT_URL}

server:
  port: 8080
